<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register Page</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

body{
    margin:0;
    font-family:Arial;

    background:
    linear-gradient(rgba(0,119,204,0.8),rgba(0,198,255,0.7)),
    url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?q=80&w=2070');

    background-size:cover;
    background-position:center;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:30px;
}

/* Register Box */

.register-box{
    width:500px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.2);
}

.register-title{
    text-align:center;
    margin-bottom:25px;
    color:#0077cc;
    font-weight:bold;
}

.form-control,
.form-select{
    height:50px;
    border-radius:10px;
}

/* Button */

.register-btn{
    width:100%;
    height:50px;
    border:none;
    border-radius:10px;
    background:#0077cc;
    color:white;
    font-size:18px;
    font-weight:bold;
    transition:0.3s;
}

.register-btn:hover{
    background:#005fa3;
}

/* Login Link */

.login-link{
    text-align:center;
    margin-top:20px;
}

</style>

</head>

<body>

<div class="register-box">

<h2 class="register-title">

<i class="bi bi-person-plus-fill"></i>

Register

</h2>

<form onsubmit="return registerUser()">

<!-- Role -->

<div class="mb-3">

<label class="form-label">
Register As
</label>

<select id="role"
class="form-select"
onchange="toggleFields()">

<option value="">
Select Role
</option>

<option value="user">
User
</option>

<option value="worker">
Worker
</option>

</select>

</div>

<!-- Name -->

<div class="mb-3">

<label class="form-label">
Name
</label>

<input type="text"
id="name"
class="form-control"
placeholder="Enter your name">

</div>

<!-- Phone -->

<div class="mb-3">

<label class="form-label">
Phone
</label>

<input type="number"
id="phone"
class="form-control"
placeholder="Enter phone number">

</div>

<!-- Email -->

<div class="mb-3">

<label class="form-label">
Email
</label>

<input type="email"
id="email"
class="form-control"
placeholder="Enter email">

</div>

<!-- Password -->

<div class="mb-3">

<label class="form-label">
Password
</label>

<input type="password"
id="password"
class="form-control"
placeholder="Enter password">

</div>

<!-- District -->

<div class="mb-3">

<label class="form-label">
District
</label>

<input type="text"
id="district"
class="form-control"
placeholder="Enter district">

</div>

<!-- Area -->

<div class="mb-3">

<label class="form-label">
Area
</label>

<input type="text"
id="area"
class="form-control"
placeholder="Enter area">

</div>

<!-- Worker Fields -->

<div id="workerFields" style="display:none;">

<!-- Skill -->

<div class="mb-3">

<label class="form-label">
Skill
</label>

<select id="skill"
class="form-select">

<option value="">
Select Skill
</option>

<option>Electrician</option>
<option>Plumber</option>
<option>AC Repair</option>
<option>Painter</option>

</select>

</div>

<!-- Price -->

<div class="mb-3">

<label class="form-label">
Price
</label>

<input type="number"
id="price"
class="form-control"
placeholder="Enter service price">

</div>

<!-- Experience -->

<div class="mb-3">

<label class="form-label">
Experience
</label>

<input type="text"
id="experience"
class="form-control"
placeholder="Enter experience">

</div>

<!-- Photo -->

<div class="mb-3">

<label class="form-label">
Upload Photo
</label>

<input type="file"
id="photo"
class="form-control">

</div>

</div>

<!-- Button -->

<button type="submit"
class="register-btn">

Register

</button>

</form>

<!-- Login Link -->

<div class="login-link">

<p>

Already have an account?

<a href="login2.html">

Login

</a>

</p>

</div>

</div>

<script>

/* Show Worker Fields */

function toggleFields(){

let role =
document.getElementById("role").value;

let workerFields =
document.getElementById("workerFields");

if(role=="worker"){

workerFields.style.display="block";

}

else{

workerFields.style.display="none";

}

}

/* Register Validation */

function registerUser(){

let role =
document.getElementById("role").value;

let name =
document.getElementById("name").value;

let phone =
document.getElementById("phone").value;

let email =
document.getElementById("email").value;

let password =
document.getElementById("password").value;

let district =
document.getElementById("district").value;

let area =
document.getElementById("area").value;

/* Common Validation */

if(
role=="" ||
name=="" ||
phone=="" ||
email=="" ||
password=="" ||
district=="" ||
area==""
){

alert(
"Please fill all fields"
);

return false;

}

/* Worker Validation */

if(role=="worker"){

let skill =
document.getElementById("skill").value;

let price =
document.getElementById("price").value;

let experience =
document.getElementById("experience").value;

let photo =
document.getElementById("photo").value;

if(
skill=="" ||
price=="" ||
experience=="" ||
photo==""
){

alert(
"Please fill all worker fields"
);

return false;

}

}

/* Success */

alert(
"Registration Successful"
);

/* Redirect */

window.location.href="login2.html";

return false;

}

</script>

</body>
</html>
