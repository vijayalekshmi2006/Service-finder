<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Register Page</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;

    background:
    linear-gradient(
    rgba(0,119,204,0.55),
    rgba(0,198,255,0.45)),
    url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?q=80&w=2070');

    background-size:cover;
    background-position:center;

    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:30px;
}

.register-box{
    width:100%;
    max-width:550px;

    background:white;

    padding:35px;

    border-radius:20px;

    box-shadow:
    0 0 20px rgba(0,0,0,0.2);
}

.register-title{
    text-align:center;
    margin-bottom:25px;
    color:#0077cc;
    font-weight:bold;
}

.form-control,
.form-select{
    height:50px;
    border-radius:10px;
}

.register-btn{
    width:100%;
    height:50px;

    border:none;

    border-radius:10px;

    background:#0077cc;

    color:white;

    font-size:18px;

    font-weight:bold;

    transition:0.3s;
}

.register-btn:hover{
    background:#005fa3;
}

.login-link{
    text-align:center;
    margin-top:20px;
}

#workerFields{
    display:none;
}

</style>

</head>

<body>

<div class="register-box">

<h2 class="register-title">

<i class="bi bi-person-plus-fill"></i>

Register

</h2>

<form id="registerForm">

<div class="mb-3">

<label class="form-label">
Register As
</label>

<select
id="role"
class="form-select"
onchange="toggleFields()">

<option value="">
Select Role
</option>

<option value="user">
User
</option>

<option value="worker">
Worker
</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">
Name
</label>

<input
type="text"
id="name"
class="form-control"
placeholder="Enter your name">

</div>

<div class="mb-3">

<label class="form-label">
Phone
</label>

<input
type="tel"
id="phone"
class="form-control"
placeholder="Enter phone number">

</div>

<div class="mb-3">

<label class="form-label">
Email
</label>

<input
type="email"
id="email"
class="form-control"
placeholder="Enter email">

</div>

<div class="mb-3">

<label class="form-label">
Password
</label>

<div class="input-group">

<input
type="password"
id="password"
class="form-control"
placeholder="Enter password">

<button
type="button"
class="btn btn-outline-secondary"
onclick="togglePassword()">

<i class="bi bi-eye"></i>

</button>

</div>

</div>

<div class="mb-3">

<label class="form-label">
District
</label>

<input
type="text"
id="district"
class="form-control"
placeholder="Enter district">

</div>

<div class="mb-3">

<label class="form-label">
Area
</label>

<input
type="text"
id="area"
class="form-control"
placeholder="Enter area">

</div>

<div id="workerFields">

<div class="mb-3">

<label class="form-label">
Skill
</label>

<select
id="skill"
class="form-select">

<option value="">
Select Skill
</option>

<option>Electrician</option>
<option>Plumber</option>
<option>AC Repair</option>
<option>Painter</option>

</select>

</div>

<div class="mb-3">

<label class="form-label">
Price
</label>

<input
type="number"
id="price"
class="form-control"
placeholder="Enter service price">

</div>

<div class="mb-3">

<label class="form-label">
Experience
</label>

<input
type="text"
id="experience"
class="form-control"
placeholder="Enter experience">

</div>

<div class="mb-3">

<label class="form-label">
Upload Photo
</label>

<input
type="file"
id="photo"
class="form-control">

</div>

</div>

<button
type="submit"
class="register-btn">

Register

</button>

</form>

<div class="login-link">

<p>

Already have an account?

<a href="login2.html">

Login

</a>

</p>

</div>

</div>

<script>

function toggleFields(){

let role =
document.getElementById("role").value;

let workerFields =
document.getElementById("workerFields");

if(role==="worker"){

workerFields.style.display="block";

}
else{

workerFields.style.display="none";

}

}

function togglePassword(){

let password =
document.getElementById("password");

if(password.type==="password"){

password.type="text";

}
else{

password.type="password";

}

}

document
.getElementById("registerForm")
.addEventListener(
"submit",
function(e){

e.preventDefault();

registerUser();

}
);

function registerUser(){

let role =
document.getElementById("role").value;

let name =
document.getElementById("name").value.trim();

let phone =
document.getElementById("phone").value.trim();

let email =
document.getElementById("email").value.trim();

let password =
document.getElementById("password").value.trim();

let district =
document.getElementById("district").value.trim();

let area =
document.getElementById("area").value.trim();

if(
role==="" ||
name==="" ||
phone==="" ||
email==="" ||
password==="" ||
district==="" ||
area===""
){

alert("Please fill all fields");

return;

}

if(phone.length!==10){

alert(
"Phone number must contain 10 digits"
);

return;

}

let emailPattern =
/^[^\s@]+@[^\s@]+\.[^\s@]+$/;

if(!emailPattern.test(email)){

alert(
"Enter a valid email address"
);

return;

}

if(password.length<6){

alert(
"Password must be at least 6 characters"
);

return;

}

let workerData = {

role,
name,
phone,
email,
password,
district,
area

};

if(role==="worker"){

let skill =
document.getElementById("skill").value;

let price =
document.getElementById("price").value;

let experience =
document.getElementById("experience").value;

let photo =
document.getElementById("photo").value;

if(
skill==="" ||
price==="" ||
experience==="" ||
photo===""
){

alert(
"Please fill all worker fields"
);

return;

}

workerData.skill = skill;
workerData.price = price;
workerData.experience = experience;
workerData.photo = photo;

}

if(role === "worker"){

    let workers =
    JSON.parse(
        localStorage.getItem("workers")
    ) || [];

    workers.push(workerData);

    localStorage.setItem(
        "workers",
        JSON.stringify(workers)
    );

}
else{

    let users =
    JSON.parse(
        localStorage.getItem("users")
    ) || [];

    users.push(workerData);

    localStorage.setItem(
        "users",
        JSON.stringify(users)
    );

}

alert(
"Registration Successful"
);

window.location.href =
"login2.html";

}

</script>

</body>
</html>
