<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Service</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f7fb;
    font-family:Arial;
}

.navbar{
    background:#0077cc;
}

.booking-card{
    background:white;
    border-radius:20px;
    padding:30px;
    margin-top:40px;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
}

.title{
    text-align:center;
    color:#0077cc;
    font-weight:bold;
    margin-bottom:20px;
}

.footer{
    background:#0077cc;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:50px;
}

</style>

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-dark">

<div class="container">

<a class="navbar-brand fw-bold" href="#">
🔧 Local Service Finder
</a>

<a href="workers2.html" class="btn btn-light">
Back
</a>

</div>

</nav>

<!-- Booking Form -->

<div class="container">

<div class="booking-card">

<h2 class="title">
Book Service
</h2>

<h4 id="workerName"></h4>

<p id="workerSkill"></p>

<p id="workerExperience"></p>

<p id="workerPrice"></p>

<hr>

<div class="mb-3">

<label class="form-label">
Booking Date
</label>

<input type="date"
id="date"
class="form-control">

</div>

<div class="mb-3">

<label class="form-label">
Booking Time
</label>

<input type="time"
id="time"
class="form-control">

</div>

<div class="mb-3">

<label class="form-label">
Address
</label>

<textarea
id="address"
class="form-control"
rows="3"
placeholder="Enter Address"></textarea>

</div>

<div class="mb-3">

<label class="form-label">
Phone Number
</label>

<input type="text"
id="phone"
class="form-control"
placeholder="Enter Phone Number">

</div>

<button
class="btn btn-success w-100"
onclick="confirmBooking()">

Confirm Booking

</button>

</div>

</div>

<!-- Footer -->

<div class="footer">

© 2026 Local Service Finder

</div>

<script>
let worker =
JSON.parse(
    localStorage.getItem("selectedWorker")
);

if(worker){

    document.getElementById("workerName").innerHTML =
    worker.name;

    document.getElementById("workerSkill").innerHTML =
    "Skill : " + worker.skill;

    document.getElementById("workerExperience").innerHTML =
    "Experience : " + worker.experience + " Years";

    document.getElementById("workerPrice").innerHTML =
    "Price : ₹" + worker.price;

}


/* Booking Function */

function confirmBooking(){

    let date =
    document.getElementById("date").value;

    let time =
    document.getElementById("time").value;

    let address =
    document.getElementById("address").value;

    let phone =
    document.getElementById("phone").value;

    if(
        date=="" ||
        time=="" ||
        address=="" ||
        phone==""
    ){

        alert("Please fill all fields");

        return;

    }

    let bookings =
    JSON.parse(
        localStorage.getItem("bookings")
    ) || [];

    let currentUser =
    JSON.parse(
        localStorage.getItem("currentUser")
    );

    bookings.push({

        workerName: worker.name,

        userName: currentUser.name,

        date: date,

        time: time,

        address: address,

        phone: phone,

        status: "Pending"

    });

    localStorage.setItem(

        "bookings",

        JSON.stringify(bookings)

    );

    alert(
        "Booking Confirmed Successfully!"
    );

    window.location.href =
    "user_home2.html";

}
</script>

</body>
</html>
