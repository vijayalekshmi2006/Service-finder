<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f7fb;
    font-family:Arial;
}

.navbar{
    background:#0077cc;
}

.dashboard-title{
    text-align:center;
    margin:30px 0;
    color:#0077cc;
    font-weight:bold;
}

.card-box{
    background:white;
    border-radius:20px;
    padding:25px;
    text-align:center;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
    transition:0.3s;
}

.card-box:hover{
    transform:translateY(-5px);
}

.number{
    font-size:35px;
    font-weight:bold;
    color:#0077cc;
}

.manage-btn{
    width:100%;
    margin-top:10px;
}

.footer{
    background:#0077cc;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:50px;
}

</style>

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-dark">

<div class="container">

<a class="navbar-brand fw-bold" href="#">
Admin Dashboard
</a>

<a href="login2.html" class="btn btn-danger">
Logout
</a>

</div>

</nav>

<!-- Title -->

<div class="container">

<h1 class="dashboard-title">
Welcome Admin
</h1>

<!-- Statistics -->

<div class="row g-4">

<div class="col-md-6">

<div class="card-box">

<h4>Total Users</h4>

<div class="number" id="totalUsers">0</div>

</div>

</div>

<div class="col-md-6">

<div class="card-box">

<h4>Total Workers</h4>

<div class="number" id="totalWorkers">0</div>

</div>

</div>

</div>





<!-- Management Section -->

<div class="row mt-5 g-4 justify-content-center">

<div class="col-md-4">

<div class="card-box">

<h4>Manage Users</h4>

<p>View and manage all users</p>

<a href="manage_users.html"
class="btn btn-primary manage-btn">

Open

</a>

</div>

</div>



<div class="col-md-4">

<div class="card-box">

<h4>Manage Workers</h4>

<p>View and manage all workers</p>

<a href="manage_workers.html"
class="btn btn-success manage-btn">

Open

</a>

</div>

</div>

</div>

</div>

<!-- Footer -->

<div class="footer">

© 2026 Local Service Finder - Admin Panel

</div>
<script>

let users =
JSON.parse(
localStorage.getItem("users")
) || [];

let workers =
JSON.parse(
localStorage.getItem("workers")
) || [];

document.getElementById(
"totalUsers"
).innerHTML = users.length;

document.getElementById(
"totalWorkers"
).innerHTML = workers.length;

</script>
</body>
</html>
