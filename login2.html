<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login Page</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

body{
    margin:0;
    font-family:Arial;

    background:
    linear-gradient(rgba(0,119,204,0.8),rgba(0,198,255,0.7)),
    url('https://images.unsplash.com/photo-1522202176988-66273c2fd55f?q=80&w=2070');

    background-size:cover;
    background-position:center;

    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;
}

/* Login Box */

.login-box{
    width:400px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.2);
}

.login-title{
    text-align:center;
    margin-bottom:25px;
    color:#0077cc;
    font-weight:bold;
}

.form-control,
.form-select{
    height:50px;
    border-radius:10px;
}

/* Button */

.login-btn{
    width:100%;
    height:50px;
    border:none;
    border-radius:10px;
    background:#0077cc;
    color:white;
    font-size:18px;
    font-weight:bold;
    transition:0.3s;
}

.login-btn:hover{
    background:#005fa3;
}

/* Register Link */

.register-link{
    text-align:center;
    margin-top:20px;
}

</style>

</head>

<body>

<div class="login-box">

<h2 class="login-title">
<i class="bi bi-person-circle"></i>
Login
</h2>

<form onsubmit="return loginUser()">

<div class="mb-3">
<label class="form-label">Login As</label>

<select id="role" class="form-select">
<option value="">Select Role</option>
<option value="user">User</option>
<option value="worker">Worker</option>
<option value="admin">Admin</option>
</select>

</div>

<div class="mb-3">

<label class="form-label">Email</label>

<input type="email"
id="email"
class="form-control"
placeholder="Enter your email">

</div>

<div class="mb-3">

<label class="form-label">Password</label>

<input type="password"
id="password"
class="form-control"
placeholder="Enter your password">

</div>

<button type="submit" class="login-btn">
Login
</button>

</form>

<div class="register-link">

<p>
Don't have an account?
<a href="register2.html">Register</a>
</p>

</div>

</div>

<script>

function loginUser(){

let role =
document.getElementById("role").value;

let email =
document.getElementById("email").value;

let password =
document.getElementById("password").value;

/* Validation */

if(role=="" || email=="" || password==""){

alert("Please fill all fields");

return false;

}

/* Admin Login */

if(role=="admin"){

if(email=="admin@gmail.com" &&
password=="admin123"){

alert("Admin Login Successful");

window.location.href="admin_dashboard.html";

}
else{

alert("Invalid Admin Email or Password");

}

}

/* User Login */

else if(role=="user"){

let users =
JSON.parse(
localStorage.getItem("users")
) || [];

let user =
users.find(function(u){

    return u.email === email &&
           u.password === password;

});

if(user){

    localStorage.setItem(
        "currentUser",
        JSON.stringify(user)
    );

    alert("User Login Successful");

    window.location.href =
    "user_home2.html";

}
else{

    alert("Invalid User Email or Password");

}

}

/* Worker Login */

else if(role=="worker"){

let workers =
JSON.parse(
localStorage.getItem("workers")
) || [];

let worker =
workers.find(function(w){

    return w.email === email &&
           w.password === password;

});

if(worker){

    localStorage.setItem(
        "workerData",
        JSON.stringify(worker)
    );

    alert("Worker Login Successful");

    window.location.href =
    "worker_home2.html";

}
else{

    alert("Invalid Worker Email or Password");

}

}

return false;

}

</script>

</body>
</html>
