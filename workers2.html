<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Workers</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f7fb;
    font-family:Arial;
}

.title{
    text-align:center;
    margin:30px;
    color:#0077cc;
    font-weight:bold;
}

.worker-card{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    transition:0.3s;
}

.worker-card:hover{
    transform:translateY(-5px);
}

.rating{
    color:orange;
}

.footer{
    background:#0077cc;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:50px;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark bg-primary">

<div class="container">

<a class="navbar-brand" href="#">
🔧 Local Service Finder
</a>

<a href="service2.html" class="btn btn-light">
Back
</a>

</div>

</nav>

<div class="container">

<h1 id="serviceTitle" class="title"></h1>

<div class="row g-4" id="workerList">

</div>

</div>

<div class="footer">
© 2026 Local Service Finder
</div>

<script>

let service =
localStorage.getItem("service2");

document.getElementById("serviceTitle").innerHTML =
service + " Workers";



let workers = "";
let registeredWorkers =
JSON.parse(
    localStorage.getItem("workers")
) || [];

registeredWorkers.forEach(function(worker){

    if(worker.skill === service){

        workers += `

        <div class="col-md-4">

            <div class="worker-card">

                <h3>${worker.name}</h3>

                <p>Skill : ${worker.skill}</p>

                <p>Experience : ${worker.experience}</p>

                <p>Price : ₹${worker.price}</p>

                <p class="rating">⭐⭐⭐⭐⭐</p>

                <button
                class="btn btn-success w-100"
                onclick="bookRegisteredWorker('${worker.name}')">

                    Book Now

                </button>

            </div>

        </div>

        `;
    }

});
document.getElementById("workerList").innerHTML =
workers;

/* Book Worker */

function bookWorker(name,skill,experience,price){

localStorage.setItem("workerName",name);

localStorage.setItem("workerSkill",skill);

localStorage.setItem("workerExperience",experience);

localStorage.setItem("workerPrice",price);

window.location.href="book_service2.html";

}
function bookRegisteredWorker(name){

    let workers =
    JSON.parse(
        localStorage.getItem("workers")
    ) || [];

    let selectedWorker =
    workers.find(
        worker => worker.name === name
    );

    localStorage.setItem(
        "selectedWorker",
        JSON.stringify(selectedWorker)
    );

    window.location.href =
    "book_service2.html";
}

</script>

</body>
</html>
