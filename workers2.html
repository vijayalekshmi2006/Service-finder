<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Workers</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f7fb;
    font-family:Arial;
}

.title{
    text-align:center;
    margin:30px;
    color:#0077cc;
    font-weight:bold;
}

.worker-card{
    background:white;
    border-radius:20px;
    padding:20px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
    transition:0.3s;
}

.worker-card:hover{
    transform:translateY(-5px);
}

.rating{
    color:orange;
}

.footer{
    background:#0077cc;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:50px;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark bg-primary">

<div class="container">

<a class="navbar-brand" href="#">
🔧 Local Service Finder
</a>

<a href="service2.html" class="btn btn-light">
Back
</a>

</div>

</nav>

<div class="container">

<h1 id="serviceTitle" class="title"></h1>

<div class="row g-4" id="workerList">

</div>

</div>

<div class="footer">
© 2026 Local Service Finder
</div>

<script>

let service =
localStorage.getItem("service2");

document.getElementById("serviceTitle").innerHTML =
service + " Workers";

let workers = "";

/* Electrician */

if(service === "Electrician"){

workers = `

<div class="col-md-4">

<div class="worker-card">

<h3>Ravi Kumar</h3>

<p>Skill : Electrician</p>

<p>Experience : 5 Years</p>

<p>Price : ₹500</p>

<p class="rating">⭐⭐⭐⭐☆</p>

<button class="btn btn-success w-100"
onclick="bookWorker('Ravi Kumar','Electrician','5 Years','500')">

Book Now

</button>

</div>

</div>

<div class="col-md-4">

<div class="worker-card">

<h3>Arun</h3>

<p>Skill : Electrician</p>

<p>Experience : 8 Years</p>

<p>Price : ₹700</p>

<p class="rating">⭐⭐⭐⭐⭐</p>

<button class="btn btn-success w-100"
onclick="bookWorker('Arun','Electrician','8 Years','700')">

Book Now

</button>

</div>

</div>

`;

}

/* Plumber */

else if(service === "Plumber"){

workers = `

<div class="col-md-4">

<div class="worker-card">

<h3>Suresh</h3>

<p>Skill : Plumber</p>

<p>Experience : 6 Years</p>

<p>Price : ₹600</p>

<p class="rating">⭐⭐⭐⭐⭐</p>

<button class="btn btn-success w-100"
onclick="bookWorker('Suresh','Plumber','6 Years','600')">

Book Now

</button>

</div>

</div>

`;

}

/* AC Repair */

else if(service === "AC Repair"){

workers = `

<div class="col-md-4">

<div class="worker-card">

<h3>Vignesh</h3>

<p>Skill : AC Repair</p>

<p>Experience : 7 Years</p>

<p>Price : ₹900</p>

<p class="rating">⭐⭐⭐⭐⭐</p>

<button class="btn btn-success w-100"
onclick="bookWorker('Vignesh','AC Repair','7 Years','900')">

Book Now

</button>

</div>

</div>

`;

}

/* Painter */

else if(service === "Painter"){

workers = `

<div class="col-md-4">

<div class="worker-card">

<h3>Kumar</h3>

<p>Skill : Painter</p>

<p>Experience : 4 Years</p>

<p>Price : ₹800</p>

<p class="rating">⭐⭐⭐⭐☆</p>

<button class="btn btn-success w-100"
onclick="bookWorker('Kumar','Painter','4 Years','800')">

Book Now

</button>

</div>

</div>

`;

}

document.getElementById("workerList").innerHTML =
workers;

/* Book Worker */

function bookWorker(name,skill,experience,price){

localStorage.setItem("workerName",name);

localStorage.setItem("workerSkill",skill);

localStorage.setItem("workerExperience",experience);

localStorage.setItem("workerPrice",price);

window.location.href="book_service2.html";

}

</script>

</body>
</html>
