<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Workers</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:#f4f7fb;
    font-family:Arial;
}

.navbar{
    background:#0077cc;
}

.title{
    text-align:center;
    margin:30px;
    color:#0077cc;
    font-weight:bold;
}

.table-box{
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.footer{
    background:#0077cc;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:50px;
}

</style>

</head>

<body>

<nav class="navbar navbar-dark">

<div class="container">

<a class="navbar-brand fw-bold" href="#">
Manage Workers
</a>

<a href="admin_dashboard.html" class="btn btn-light">
Back
</a>

</div>

</nav>

<div class="container">

<h1 class="title">
Registered Workers
</h1>

<div class="table-box">

<table class="table table-bordered table-hover">

<thead class="table-success">

<tr>

<th>ID</th>
<th>Name</th>
<th>Skill</th>
<th>Experience</th>
<th>Location</th>
<th>Action</th>

</tr>

</thead>

<tbody id="workerTable">

</tbody>

</table>

</div>

</div>

<div class="footer">
© 2026 Local Service Finder
</div>
<script>

let workers =
JSON.parse(
localStorage.getItem("workers")
) || [];

let rows = "";

workers.forEach(function(worker,index){

rows += `

<tr>

<td>${index+1}</td>

<td>${worker.name}</td>

<td>${worker.skill}</td>

<td>${worker.experience}</td>

<td>${worker.district}</td>

<td>

<button
class="btn btn-danger btn-sm">

Delete

</button>

</td>

</tr>

`;

});

document.getElementById(
"workerTable"
).innerHTML = rows;

</script>
</body>
</html>
