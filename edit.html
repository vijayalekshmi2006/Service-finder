<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    margin:0;
    font-family:Arial;
    background:#f4f7fb;
}

/* Form Box */

.edit-box{
    width:500px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.1);
}

.form-control{
    height:50px;
    border-radius:10px;
}

.save-btn{
    width:100%;
    height:50px;
    border:none;
    border-radius:10px;
    background:#0077cc;
    color:white;
    font-size:18px;
    font-weight:bold;
}

.save-btn:hover{
    background:#005fa3;
}

.back-btn{
    width:100%;
    height:50px;
    border:none;
    border-radius:10px;
    background:#6c757d;
    color:white;
    font-size:18px;
    font-weight:bold;
    margin-top:10px;
}

.back-btn:hover{
    background:#555;
}

</style>

</head>

<body>

<div class="container d-flex justify-content-center align-items-center"
style="min-height:100vh;">

<div class="edit-box">

<h2 class="text-center text-primary mb-4">

Edit Profile

</h2>

<!-- Form -->

<form onsubmit="return saveProfile()">

<!-- Name -->

<div class="mb-3">

<label class="form-label">
Name
</label>

<input type="text"
id="name"
class="form-control"
placeholder="Enter name">

</div>

<!-- Skill -->

<div class="mb-3">

<label class="form-label">
Skill
</label>

<input type="text"
id="skill"
class="form-control"
placeholder="Enter skill">

</div>

<!-- Experience -->

<div class="mb-3">

<label class="form-label">
Experience
</label>

<input type="text"
id="experience"
class="form-control"
placeholder="Enter experience">

</div>

<!-- Price -->

<div class="mb-3">

<label class="form-label">
Price
</label>

<input type="number"
id="price"
class="form-control"
placeholder="Enter price">

</div>

<!-- District -->

<div class="mb-3">

<label class="form-label">
District
</label>

<input type="text"
id="district"
class="form-control"
placeholder="Enter district">

</div>

<!-- Area -->

<div class="mb-3">

<label class="form-label">
Area
</label>

<input type="text"
id="area"
class="form-control"
placeholder="Enter area">

</div>

<!-- Save Button -->

<button type="submit"
class="save-btn">

Save Changes

</button>

<!-- Back Button -->

<button type="button"
class="back-btn"
onclick="goBack()">

Back

</button>

</form>

</div>

</div>

<script>

function saveProfile(){

let name =
document.getElementById("name").value;

let skill =
document.getElementById("skill").value;

let experience =
document.getElementById("experience").value;

let price =
document.getElementById("price").value;

let district =
document.getElementById("district").value;

let area =
document.getElementById("area").value;

/* Validation */

if(name=="" || skill=="" || experience=="" || price=="" || district=="" || area==""){

alert(
"Please fill all fields"
);

return false;

}

/* Success */

alert(
"Profile Updated Successfully"
);

/* Redirect */

window.location.href="worker_home2.html";

return false;

}

/* Back */

function goBack(){

window.location.href="worker_home2.html";

}

</script>

</body>
</html>
